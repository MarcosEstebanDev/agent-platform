services:
  postgres:
    image: postgres:17-alpine
    container_name: agent-platform-db
    environment:
      POSTGRES_USER: agent
      POSTGRES_PASSWORD: agent
      POSTGRES_DB: agent_platform
    ports:
      - '5433:5432'
    volumes:
      - agent-platform-db:/var/lib/postgresql/data
    healthcheck:
      test: ['CMD-SHELL', 'pg_isready -U agent -d agent_platform']
      interval: 5s
      timeout: 5s
      retries: 10

  # Cola de trabajo (BullMQ). Puerto 6380 en el host por la misma razon que
  # Postgres usa el 5433: no chocar con un Redis local si lo hubiera.
  redis:
    image: redis:7-alpine
    container_name: agent-platform-redis
    command: ['redis-server', '--appendonly', 'yes']
    ports:
      - '6380:6379'
    volumes:
      - agent-platform-redis:/data
    healthcheck:
      test: ['CMD', 'redis-cli', 'ping']
      interval: 5s
      timeout: 3s
      retries: 10

volumes:
  agent-platform-db:
  agent-platform-redis:
